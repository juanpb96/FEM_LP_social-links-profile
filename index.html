<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <meta
      name="description"
      content="Social links for Jessica Randall, a front-end developer based in London: GitHub, Frontend Mentor, LinkedIn, Twitter and Instagram."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | Social links profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="card">
      <figure class="user">
        <img
          class="photo"
          src="./assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall"
        />
        <figcaption>
          <h1 class="name">Jessica Randall</h1>
          <p class="location">London, United Kingdom</p>
        </figcaption>
      </figure>

      <p class="quote">"Front-end developer and avid reader."</p>

      <nav aria-label="Jessica's social links">
        <ul>
          <li><a href="https://github.com/juanpb96">GitHub</a></li>
          <li>
            <a href="https://www.frontendmentor.io/profile/juanpb96"
              >Frontend Mentor</a
            >
          </li>
          <li>
            <a href="https://www.linkedin.com/in/juanpablobonilla/">LinkedIn</a>
          </li>
          <li><a href="https://twitter.com">Twitter</a></li>
          <li><a href="https://www.instagram.com">Instagram</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
